server {
  listen 80;
  root /usr/share/nginx/html;

  # nginx does not know .mjs; browsers refuse a module worker without a JavaScript type.
  include /etc/nginx/mime.types;
  types {
    application/javascript mjs;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Hashed build output never changes.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Tiles are read with range requests and replaced on each data refresh.
  location /tiles/ {
    add_header Cache-Control "public, max-age=3600";
  }

  location /basemap-assets/ {
    add_header Cache-Control "public, max-age=604800";
  }

  # Route planner: the BRouter container from compose.yml. Looked up per request
  # so the site still starts when no router is running.
  location /brouter {
    resolver 127.0.0.11 valid=30s;
    set $router http://router:17777;
    proxy_pass $router;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
