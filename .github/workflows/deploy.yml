name: Deploy
on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    # Nightly, a little after 3 am in Ottawa.
    # Off the hour on purpose: GitHub delays or drops schedules set for :00.
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install tile tools
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool tippecanoe
          pipx install osmium # pyosmium-up-to-date, which applies OSM's change files
          curl -fsSL https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin pmtiles
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Basemap cache key (refreshes monthly)
        id: month
        run: echo "value=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: basemap
        with:
          path: |
            web/public/tiles/basemap.pmtiles
            web/public/basemap-assets
          key: basemap-${{ hashFiles('region.json', 'pipeline/build-basemap.sh') }}-${{ steps.month.outputs.value }}
      - if: steps.basemap.outputs.cache-hit != 'true'
        run: npm run basemap
      # The region's OSM data carries over from run to run and is only topped up
      # with the latest changes. Every run saves its own copy; the newest is restored.
      - uses: actions/cache@v6
        with:
          path: |
            .cache/osm/region.osm.pbf
            .cache/osm/*.poly
          key: osm-${{ hashFiles('region.json', 'pipeline/update-osm.sh') }}-${{ github.run_id }}
          restore-keys: osm-${{ hashFiles('region.json', 'pipeline/update-osm.sh') }}-
      - run: npm run tiles
      # GitHub Pages: main only, served under /<repo>/. The route planner shows
      # there once the ROUTER_URL repository variable points at a running router.
      - if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
        id: pages
      - if: github.ref == 'refs/heads/main'
        run: npm run build -w web -- --base "${{ steps.pages.outputs.base_path }}/"
        env:
          VITE_ROUTER_URL: ${{ vars.ROUTER_URL }}
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

      # Docker images with the data baked in: the site, and the router.
      - uses: actions/cache@v6
        with:
          path: routing/data/elevation
          key: elevation-${{ hashFiles('region.json', 'routing/prepare-data.sh') }}
      - run: routing/prepare-data.sh
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: image
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - uses: docker/metadata-action@v6
        id: router-image
        with:
          images: ghcr.io/${{ github.repository }}-router
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: routing
          push: true
          tags: ${{ steps.router-image.outputs.tags }}
          labels: ${{ steps.router-image.outputs.labels }}

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
