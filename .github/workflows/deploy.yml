name: Deploy
on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "0 8 * * *" # nightly, 3 am in Ottawa, after Geofabrik publishes its daily extracts
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install tile tools
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool tippecanoe
          curl -fsSL https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin pmtiles
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Basemap cache key (refreshes monthly)
        id: month
        run: echo "value=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: basemap
        with:
          path: |
            web/public/tiles/basemap.pmtiles
            web/public/basemap-assets
          key: basemap-${{ hashFiles('region.json', 'pipeline/build-basemap.sh') }}-${{ steps.month.outputs.value }}
      - if: steps.basemap.outputs.cache-hit != 'true'
        run: npm run basemap
      - run: npm run tiles
      # GitHub Pages: main only (pushes and the nightly run), served under /<repo>/.
      - if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
        id: pages
      - if: github.ref == 'refs/heads/main'
        run: npm run build -w web -- --base "${{ steps.pages.outputs.base_path }}/"
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

      # Docker image with the tiles baked in: pushes to main and version tags.
      - if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push'
        uses: docker/metadata-action@v6
        id: image
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
